openapi: 3.0.3
info:
  title: Taller Docker API
  description: API que genera valores aleatorios.
  version: 1.1.0
servers:
  - url: http://localhost:8000
paths:
  /obtenerCedula:
    get:
      summary: Obtener una cedula aleatoria
      operationId: obtenerCedula
      responses:
        '200':
          description: Cedula generada correctamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - cedula
                properties:
                  cedula:
                    type: integer
                    format: int64
                    minimum: 1000000000
                    maximum: 9999999999
                    example: 1234567890
  /obtenerNumeroRomano:
    get:
      summary: Obtener un numero romano aleatorio entre 50 y 100
      operationId: obtenerNumeroRomano
      responses:
        '200':
          description: Numero romano generado correctamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - numero
                  - numero_romano
                properties:
                  numero:
                    type: integer
                    minimum: 50
                    maximum: 100
                    example: 74
                  numero_romano:
                    type: string
                    example: LXXIV
  /multiplicarPorDos:
    get:
      summary: Multiplicar un numero por dos
      operationId: multiplicarPorDos
      parameters:
        - name: numero
          in: query
          required: true
          description: Numero que se multiplicara por dos
          schema:
            type: number
            format: double
          example: 5
      responses:
        '200':
          description: Numero multiplicado correctamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - numero
                  - resultado
                properties:
                  numero:
                    type: number
                    format: double
                    example: 5
                  resultado:
                    type: number
                    format: double
                    example: 10
        '422':
          description: El parametro numero no es valido o no fue enviado
